name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and test artifacts
        run: bash gradlew --no-daemon :annotations:jar :obfuscator:test :obfuscator:shadowJar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: J2Rust ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            obfuscator/build/libs/obfuscator.jar
            annotations/build/libs/annotations.jar
