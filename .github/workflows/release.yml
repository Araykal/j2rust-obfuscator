name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and test artifacts
        run: ./gradlew --no-daemon :annotations:jar :obfuscator:test :obfuscator:shadowJar

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "obfuscator/build/libs/obfuscator.jar" \
            "annotations/build/libs/annotations.jar" \
            --title "J2Rust ${GITHUB_REF_NAME}" \
            --generate-notes
